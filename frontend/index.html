<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom is pinned. Installed to a home screen this app is a fixed-layout
         surface, and iOS persists any pinch-zoom across launches — one stray
         pinch and every subsequent launch opens zoomed in. System text size
         (Dynamic Type / per-app zoom) still applies. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Mood — a calm place to notice how you feel</title>
    <meta
      name="description"
      content="Record how you feel in seconds, keep the observations that matter, and see the patterns underneath."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f7f7f9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mood" />
    <meta name="color-scheme" content="light" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
